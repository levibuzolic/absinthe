name: Incremental HTTP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.5"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - name: Run incremental HTTP integration
        run: integration/incremental_http/run
